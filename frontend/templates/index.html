{% extends "base.html" %}
{% block title %}台账管理 - 警情案件工作台账登记系统{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h2 class="mb-0">台账管理</h2>
    <p class="page-subtitle">警情案件工作台账列表</p>
  </div>
  <button class="btn btn-primary d-inline-flex align-items-center gap-1" onclick="openLedgerForm(null)">
    <i class="bi bi-plus-lg"></i> 新增台账
  </button>
</div>

<!-- 统计摘要 -->
<div class="row g-3 mb-4">
  <div class="col-lg-3 col-6">
    <div class="stat-card">
      <div class="stat-icon" style="background:#eff6ff">
        <i class="bi bi-file-text" style="color:var(--bs-primary)"></i>
      </div>
      <div>
        <div class="stat-value text-body" x-text="total"></div>
        <div class="stat-label">总台账数</div>
      </div>
    </div>
  </div>
  <div class="col-lg-3 col-6">
    <div class="stat-card">
      <div class="stat-icon" style="background:#fffbeb">
        <i class="bi bi-clock" style="color:#f59e0b"></i>
      </div>
      <div>
        <div class="stat-value" style="color:#f59e0b" x-text="openCount"></div>
        <div class="stat-label">未办结</div>
      </div>
    </div>
  </div>
  <div class="col-lg-3 col-6">
    <div class="stat-card">
      <div class="stat-icon" style="background:#f0fdf4">
        <i class="bi bi-check-circle" style="color:#16a34a"></i>
      </div>
      <div>
        <div class="stat-value" style="color:#16a34a" x-text="closedCount"></div>
        <div class="stat-label">已办结</div>
      </div>
    </div>
  </div>
  <div class="col-lg-3 col-6">
    <div class="stat-card">
      <div class="stat-icon" style="background:#fef2f2">
        <i class="bi bi-exclamation-triangle" style="color:#dc2626"></i>
      </div>
      <div>
        <div class="stat-value" style="color:#dc2626" x-text="escalatedCount"></div>
        <div class="stat-label">已提级</div>
      </div>
    </div>
  </div>
</div>

<!-- 搜索筛选栏 -->
<div class="filter-card" x-data="{
  keyword: '{{ request.args.get('keyword', '') }}',
  jurisdiction: '{{ request.args.get('jurisdiction', '') }}',
  case_category: '{{ request.args.get('case_category', '') }}',
  info_source: '',
  is_closed: '{{ request.args.get('is_closed', '') }}',
  is_escalated: '{{ request.args.get('is_escalated', '') }}',
  date_from: '{{ request.args.get('date_from', '') }}',
  date_to: '{{ request.args.get('date_to', '') }}',
  infoSources: [],
  caseCategories: [],
  async init() {
    var enums = await enumCache.get();
    this.infoSources = enums.info_source || [];
    this.caseCategories = enums.case_category || [];
  },
  doSearch() { window.listPage.search(); },
  doReset() { window.listPage.reset(); }
}">
  <div class="row g-3 mb-3">
    <div class="col-lg-3 col-md-4 col-sm-6">
      <label class="form-label">关键词搜索</label>
      <div class="position-relative">
        <i class="bi bi-search position-absolute text-secondary" style="left:10px;top:8px;font-size:13px"></i>
        <input type="text" class="form-control ps-4" placeholder="搜索序号/人员/基本情况"
               x-model="keyword" @keyup.enter="doSearch()">
      </div>
    </div>
    <div class="col-lg-3 col-md-4 col-sm-6">
      <label class="form-label">辖区</label>
      <input type="text" class="form-control" placeholder="输入辖区" x-model="jurisdiction">
    </div>
    <div class="col-lg-3 col-md-4 col-sm-6">
      <label class="form-label">案件类别</label>
      <select class="form-select" x-model="case_category">
        <option value="">全部</option>
        <template x-for="opt in caseCategories" :key="opt.value">
          <option :value="opt.value" x-text="opt.label"></option>
        </template>
      </select>
    </div>
    <div class="col-lg-3 col-md-4 col-sm-6">
      <label class="form-label">信息来源</label>
      <select class="form-select" x-model="info_source">
        <option value="">全部</option>
        <template x-for="opt in infoSources" :key="opt.value">
          <option :value="opt.value" x-text="opt.label"></option>
        </template>
      </select>
    </div>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-lg-3 col-md-4 col-sm-6">
      <label class="form-label">办结状态</label>
      <select class="form-select" x-model="is_closed">
        <option value="">全部</option>
        <option value="1">已办结</option>
        <option value="0">未办结</option>
      </select>
    </div>
    <div class="col-lg-3 col-md-4 col-sm-6">
      <label class="form-label">提级状态</label>
      <select class="form-select" x-model="is_escalated">
        <option value="">全部</option>
        <option value="1">已提级</option>
        <option value="0">未提级</option>
      </select>
    </div>
    <div class="col-lg-3 col-md-4 col-sm-6">
      <label class="form-label">发生时间起</label>
      <input type="date" class="form-control" x-model="date_from">
    </div>
    <div class="col-lg-3 col-md-4 col-sm-6">
      <label class="form-label">发生时间止</label>
      <input type="date" class="form-control" x-model="date_to">
    </div>
  </div>
  <div class="d-flex justify-content-end gap-2">
    <button class="btn btn-outline-secondary btn-sm" @click="doReset()">
      <i class="bi bi-arrow-repeat me-1"></i>重置
    </button>
    <button class="btn btn-primary btn-sm" @click="doSearch()">
      <i class="bi bi-search me-1"></i>搜索
    </button>
  </div>
</div>

<!-- 数据表格 -->
<div class="table-card" x-data="listData()" id="listApp">
  <div class="table-responsive">
    <table class="table table-fixed-col-right">
      <thead>
        <tr>
          <th class="sortable-header" @click="toggleSort('serial_no')" style="min-width:150px">
            序号 <span class="sort-indicator" :class="{active:sort_by==='serial_no'}" x-html="sortIcon('serial_no')"></span>
          </th>
          <th style="min-width:70px">直守人员</th>
          <th class="sortable-header" @click="toggleSort('incident_time')" style="min-width:140px">
            发生时间 <span class="sort-indicator" :class="{active:sort_by==='incident_time'}" x-html="sortIcon('incident_time')"></span>
          </th>
          <th style="min-width:100px">辖区</th>
          <th style="min-width:80px">案件类别</th>
          <th style="min-width:100px">信息来源</th>
          <th style="min-width:180px">基本情况</th>
          <th style="min-width:80px">办结状态</th>
          <th style="min-width:80px">提级状态</th>
          <th style="min-width:130px">操作</th>
        </tr>
      </thead>
      <tbody>
        <template x-if="items.length === 0 && !loading">
          <tr>
            <td colspan="10">
              <div class="empty-state">
                <div class="empty-icon"><i class="bi bi-inbox"></i></div>
                <div class="empty-text">暂无匹配记录</div>
              </div>
            </td>
          </tr>
        </template>
        <template x-if="loading">
          <tr>
            <td colspan="10">
              <div class="empty-state">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="empty-text mt-2">加载中...</div>
              </div>
            </td>
          </tr>
        </template>
        <template x-for="item in items" :key="item.id">
          <tr>
            <td>
              <a :href="'/ledger/'+item.id+'/view'" class="table-link" x-text="item.serial_no"></a>
            </td>
            <td x-text="item.duty_officer"></td>
            <td class="text-secondary small" x-text="item.incident_time"></td>
            <td x-text="item.jurisdiction"></td>
            <td x-text="item.case_category"></td>
            <td x-text="item.info_source"></td>
            <td>
              <div class="cell-truncate" :title="item.case_basic_info_summary" x-text="item.case_basic_info_summary"></div>
            </td>
            <td>
              <span class="badge-status" :class="item.is_closed ? 'badge-closed' : 'badge-open'"
                    x-text="item.is_closed ? '已办结' : '未办结'"></span>
            </td>
            <td>
              <span class="badge-status" :class="item.is_escalated ? 'badge-escalated' : 'badge-not-escalated'"
                    x-text="item.is_escalated ? '已提级' : '未提级'"></span>
            </td>
            <td>
              <div class="table-actions justify-content-center">
                <a :href="'/ledger/'+item.id+'/view'" class="btn-icon" title="查看">
                  <i class="bi bi-eye"></i>
                </a>
                <button class="btn-icon" title="编辑" @click="editItem(item)">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn-icon delete" title="删除" @click="confirmDelete(item)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- 分页 -->
  <div class="pagination-bar" x-show="total_pages > 1">
    <div>
      <span class="page-info" x-text="'共 '+total+' 条'"></span>
    </div>
    <nav>
      <ul class="pagination mb-0">
        <li class="page-item" :class="{disabled:page<=1}">
          <a class="page-link" href="#" @click.prevent="go(page-1)"><i class="bi bi-chevron-left"></i></a>
        </li>
        <template x-for="p in pageNumbers" :key="p">
          <li class="page-item" :class="{active:p===page}">
            <a class="page-link" href="#" @click.prevent="go(p)" x-text="p"></a>
          </li>
        </template>
        <li class="page-item" :class="{disabled:page>=total_pages}">
          <a class="page-link" href="#" @click.prevent="go(page+1)"><i class="bi bi-chevron-right"></i></a>
        </li>
      </ul>
    </nav>
  </div>
</div>

{% include '_ledger_form_modal.html' %}
{% endblock %}

{% block extra_js %}
<script>
function listData() {
  return {
    items: [],
    total: 0,
    total_pages: 0,
    page: 1,
    per_page: 20,
    sort_by: 'incident_time',
    sort_order: 'desc',
    loading: false,
    openCount: 0,
    closedCount: 0,
    escalatedCount: 0,

    async init() {
      window.listPage = this;
      this.loadFromUrl();
      await this.loadList();
      window.addEventListener('ledger-saved', this.loadList.bind(this));
    },

    loadFromUrl() {
      this.page = parseInt(getQueryParam('page')) || 1;
    },

    getFilterData() {
      var filter = document.querySelector('.filter-card').__x;
      return filter ? filter.$data : {};
    },

    async loadList() {
      this.loading = true;
      var f = this.getFilterData();
      var params = {
        page: this.page,
        per_page: this.per_page,
        sort_by: this.sort_by,
        sort_order: this.sort_order
      };
      if (f.keyword) params.keyword = f.keyword;
      if (f.jurisdiction) params.jurisdiction = f.jurisdiction;
      if (f.case_category) params.case_category = f.case_category;
      if (f.info_source) params.info_source = f.info_source;
      if (f.is_closed) params.is_closed = f.is_closed;
      if (f.is_escalated) params.is_escalated = f.is_escalated;
      if (f.date_from) params.date_from = f.date_from;
      if (f.date_to) params.date_to = f.date_to;

      try {
        var res = await api.get('/api/ledger', params);
        this.items = res.data.items || [];
        this.total = res.data.total || 0;
        this.total_pages = res.data.total_pages || 0;
        this.openCount = res.data.open_count || 0;
        this.closedCount = res.data.closed_count || 0;
        this.escalatedCount = res.data.escalated_count || 0;
      } catch (err) {
        handleApiError(err, '加载列表失败');
      }
      this.loading = false;
    },

    search() {
      this.page = 1;
      var f = this.getFilterData();
      updateQueryString({
        keyword: f.keyword, jurisdiction: f.jurisdiction,
        case_category: f.case_category, info_source: f.info_source,
        is_closed: f.is_closed, is_escalated: f.is_escalated,
        date_from: f.date_from, date_to: f.date_to
      });
      this.loadList();
    },

    reset() {
      var filterEl = document.querySelector('.filter-card');
      if (filterEl && filterEl.__x) {
        var d = filterEl.__x.$data;
        d.keyword = ''; d.jurisdiction = ''; d.case_category = '';
        d.info_source = ''; d.is_closed = ''; d.is_escalated = '';
        d.date_from = ''; d.date_to = '';
      }
      this.page = 1;
      updateQueryString({});
      this.loadList();
    },

    go(p) {
      if (p < 1 || p > this.total_pages) return;
      this.page = p;
      this.loadList();
    },

    editItem(item) {
      openLedgerForm(item.id);
    },

    toggleSort(field) {
      if (this.sort_by === field) {
        this.sort_order = this.sort_order === 'asc' ? 'desc' : 'asc';
      } else {
        this.sort_by = field;
        this.sort_order = 'asc';
      }
      this.page = 1;
      this.loadList();
    },

    sortIcon(field) {
      if (this.sort_by !== field) return '<i class="bi bi-arrow-down-up" style="font-size:10px"></i>';
      return this.sort_order === 'asc'
        ? '<i class="bi bi-caret-up-fill" style="font-size:8px"></i>'
        : '<i class="bi bi-caret-down-fill" style="font-size:8px"></i>';
    },

    get pageNumbers() {
      var pages = [];
      var total = this.total_pages;
      var current = this.page;
      var start = Math.max(1, current - 2);
      var end = Math.min(total, current + 2);
      if (start > 1) { pages.push(1); if (start > 2) pages.push('...'); }
      for (var i = start; i <= end; i++) pages.push(i);
      if (end < total) { if (end < total - 1) pages.push('...'); pages.push(total); }
      return pages;
    },

    async confirmDelete(item) {
      var ok = await confirmDialog('确认删除', '确定要删除序号为 <strong>' + escapeHtml(item.serial_no) + '</strong> 的台账记录吗？此操作不可撤销。');
      if (!ok) return;
      try {
        await api.delete('/api/ledger/' + item.id);
        Toast.show('删除成功');
        this.loadList();
      } catch (err) {
        handleApiError(err, '删除失败');
      }
    }
  };
}

function modalForm() {
  return {
    isEdit: false,
    editSerial: '',
    recordId: null,
    form: {
      serial_no: '', duty_officer: '', personnel: '', incident_time: '',
      info_source: '', jurisdiction: '', case_category: '', case_basic_info: '',
      on_site_personnel: '', on_site_handling: '', analysis_situation: '',
      closure_status: '', follow_up: '', handover: '',
      is_closed: false, is_escalated: false
    },
    existingImages: [],
    newImageFiles: [],
    infoSources: [],
    caseCategories: [],
    errors: {},
    submitting: false,
    dirty: false,
    forceClose: false,
    bsModal: null,

    async init() {
      var enums = await enumCache.get();
      this.infoSources = enums.info_source || [];
      this.caseCategories = enums.case_category || [];
    },

    resetForm() {
      this.isEdit = false;
      this.editSerial = '';
      this.recordId = null;
      this.form = {
        serial_no: '', duty_officer: '', personnel: '', incident_time: '',
        info_source: '', jurisdiction: '', case_category: '', case_basic_info: '',
        on_site_personnel: '', on_site_handling: '', analysis_situation: '',
        closure_status: '', follow_up: '', handover: '',
        is_closed: false, is_escalated: false
      };
      this.existingImages.forEach(function(f){ if(f.previewUrl) URL.revokeObjectURL(f.previewUrl); });
      this.existingImages = [];
      this.newImageFiles.forEach(function(f){ URL.revokeObjectURL(f.previewUrl); });
      this.newImageFiles = [];
      this.errors = {};
      this.dirty = false;
      this.submitting = false;
      this.forceClose = false;
    },

    async openForEdit(recordId) {
      this.resetForm();
      this.isEdit = true;
      this.recordId = recordId;
      try {
        var res = await api.get('/api/ledger/' + recordId);
        var r = res.data;
        this.editSerial = r.serial_no;
        this.form.serial_no = r.serial_no || '';
        this.form.duty_officer = r.duty_officer || '';
        this.form.personnel = '';
        this.form.incident_time = r.incident_time ? toDatetimeLocal(r.incident_time) : '';
        this.form.info_source = r.info_source || '';
        this.form.jurisdiction = r.jurisdiction || '';
        this.form.case_category = r.case_category || '';
        this.form.case_basic_info = r.case_basic_info || '';
        this.form.on_site_personnel = r.on_site_personnel || '';
        this.form.on_site_handling = r.on_site_handling || '';
        this.form.analysis_situation = r.analysis_situation || '';
        this.form.closure_status = r.closure_status || '';
        this.form.follow_up = r.follow_up || '';
        this.form.handover = r.handover || '';
        this.form.is_closed = !!r.is_closed;
        this.form.is_escalated = !!r.is_escalated;
        var images = r.images || [];
        this.existingImages = images.map(function(img){ return {id:img.id, url:img.url}; });
      } catch (err) {
        handleApiError(err, '加载台账数据失败');
        throw err;
      }
    },

    handleClose() {
      if (this.dirty && !this.submitting) {
        this.confirmLeave();
      } else {
        this.forceClose = true;
        this.bsModal.hide();
      }
    },

    confirmLeave() {
      var self = this;
      confirmDialog('提示', '表单数据尚未保存，确定要离开吗？').then(function(ok){
        if (ok) {
          self.forceClose = true;
          self.bsModal.hide();
          self.resetForm();
        }
      });
    },

    handleDrop(e) {
      this.addFiles(e.dataTransfer.files);
    },

    handleFileSelect(e) {
      this.addFiles(e.target.files);
      e.target.value = '';
    },

    addFiles(files) {
      var totalCount = this.existingImages.length + this.newImageFiles.length;
      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        if (totalCount >= 9) { Toast.show('最多上传 9 张图片', 'warning'); break; }
        var err = validateImageFile(file);
        if (err) { Toast.show(err, 'warning'); continue; }
        file.previewUrl = URL.createObjectURL(file);
        this.newImageFiles.push(file);
        totalCount++;
        this.dirty = true;
      }
    },

    removeExisting(img) {
      if (!this.recordId) return;
      var self = this;
      api.delete('/api/ledger/' + this.recordId + '/images/' + img.id)
        .then(function(){
          self.existingImages = self.existingImages.filter(function(e){return e.id !== img.id;});
          self.dirty = true;
        })
        .catch(function(err){ handleApiError(err, '删除图片失败'); });
    },

    removeNew(idx) {
      URL.revokeObjectURL(this.newImageFiles[idx].previewUrl);
      this.newImageFiles.splice(idx, 1);
      this.dirty = true;
    },

    validate() {
      this.errors = {};
      if (!this.form.duty_officer || !this.form.duty_officer.trim()) {
        this.errors.duty_officer = '请输入直守人员';
      }
      if (!this.form.incident_time) {
        this.errors.incident_time = '请选择发生时间';
      }
      if (!this.form.info_source) {
        this.errors.info_source = '请选择信息来源';
      }
      if (!this.form.jurisdiction || !this.form.jurisdiction.trim()) {
        this.errors.jurisdiction = '请输入辖区';
      }
      if (!this.form.case_category) {
        this.errors.case_category = '请选择案件类别';
      }
      if (!this.form.case_basic_info || !this.form.case_basic_info.trim()) {
        this.errors.case_basic_info = '请输入案件基本情况';
      }
      return Object.keys(this.errors).length === 0;
    },

    async submit() {
      if (!this.validate()) {
        var firstErr = this.bsModal._element.querySelector('.is-invalid');
        if (firstErr) firstErr.scrollIntoView({behavior:'smooth',block:'center'});
        return;
      }
      this.submitting = true;
      this.errors = {};

      var body = {
        serial_no: this.form.serial_no,
        duty_officer: this.form.duty_officer,
        personnel: this.form.personnel,
        incident_time: this.form.incident_time ? fromDatetimeLocal(this.form.incident_time) : '',
        info_source: this.form.info_source,
        jurisdiction: this.form.jurisdiction,
        case_category: this.form.case_category,
        case_basic_info: this.form.case_basic_info,
        on_site_personnel: this.form.on_site_personnel,
        on_site_handling: this.form.on_site_handling,
        analysis_situation: this.form.analysis_situation,
        closure_status: this.form.closure_status,
        follow_up: this.form.follow_up,
        handover: this.form.handover,
        is_closed: this.form.is_closed ? 1 : 0,
        is_escalated: this.form.is_escalated ? 1 : 0
      };

      try {
        var res;
        if (this.recordId) {
          res = await api.patch('/api/ledger/' + this.recordId, body);
        } else {
          res = await api.post('/api/ledger', body);
        }

        var ledgerId = this.recordId || res.data.id;

        if (this.newImageFiles.length > 0) {
          for (var i = 0; i < this.newImageFiles.length; i++) {
            await api.postFormData('/api/ledger/' + ledgerId + '/images', this.newImageFiles[i]);
          }
        }

        Toast.show(this.recordId ? '台账更新成功' : '台账 ' + (res.data.serial_no || '') + ' 创建成功');
        this.dirty = false;
        this.forceClose = true;
        this.bsModal.hide();
        this.resetForm();
        window.dispatchEvent(new CustomEvent('ledger-saved', {detail:{id:ledgerId}}));
      } catch (err) {
        if (err.code === 400) {
          Toast.show(err.message || '请检查表单数据', 'error');
        } else {
          handleApiError(err, '保存失败，请稍后重试');
        }
      }
      this.submitting = false;
    }
  };
}

window.openLedgerForm = function(recordId) {
  var el = document.getElementById('ledgerFormModal');
  if (!el || !el.__x) { setTimeout(function(){ openLedgerForm(recordId); }, 100); return; }
  var comp = el.__x.$data;
  if (recordId) {
    comp.openForEdit(recordId).then(function(){
      comp.bsModal.show();
    }).catch(function(){
      // 加载失败，不弹出
    });
  } else {
    comp.resetForm();
    comp.bsModal.show();
  }
};
</script>
{% endblock %}
