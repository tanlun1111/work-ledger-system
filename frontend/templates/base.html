<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}警情案件工作台账登记系统{% endblock %}</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <div class="nav-avatar">
        <i class="bi bi-shield-check"></i>
      </div>
      警情案件工作台账登记系统
    </a>
    <div class="d-flex align-items-center ms-auto gap-2">
      <span class="text-white-50" style="font-size:13px">
        <i class="bi bi-person-circle me-1"></i>管理员
      </span>
    </div>
  </div>
</nav>

<main class="flex-grow-1" style="padding-top:56px">
  <div class="container-fluid px-4 py-3" style="max-width:1280px">
    {% block content %}{% endblock %}
  </div>
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="globalToastContainer"></div>

<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/alpinejs/3.14.1/cdn.min.js" defer></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/components.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
