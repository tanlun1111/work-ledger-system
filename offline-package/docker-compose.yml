services:
  db:
    image: mysql:5.7
    container_name: ledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-ledger2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-work_ledger}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_allowed_packet=128M
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "--password=${MYSQL_PASSWORD:-ledger2026}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: ledger-app:1.0.3
    container_name: ledger-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ledger2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-work_ledger}
      TZ: Asia/Shanghai
    volumes:
      - upload_data:/app/uploads
    ports:
      - "5000:5000"

volumes:
  mysql_data:
  upload_data:
