{% extends "base.html" %}
{% block title %}台账管理 - 警情案件工作台账登记系统{% endblock %}

{% block content %}
<div x-data="listPage()" x-init="init()">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-1">台账管理</h4>
      <p class="text-muted small mb-0">警情案件工作台账列表</p>
    </div>
    <a href="/ledger/add" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i>新增台账
    </a>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card border-0 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="bg-primary bg-opacity-10 rounded-3 p-2"><i class="bi bi-file-text fs-4 text-primary"></i></div>
          <div><div class="fs-4 fw-bold" x-text="total"></div><div class="text-muted small">总台账数</div></div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card border-0 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="bg-warning bg-opacity-10 rounded-3 p-2"><i class="bi bi-clock fs-4 text-warning"></i></div>
          <div><div class="fs-4 fw-bold text-warning" x-text="unclosedCount"></div><div class="text-muted small">未办结</div></div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card border-0 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="bg-success bg-opacity-10 rounded-3 p-2"><i class="bi bi-check-circle fs-4 text-success"></i></div>
          <div><div class="fs-4 fw-bold text-success" x-text="closedCount"></div><div class="text-muted small">已办结</div></div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card border-0 shadow-sm">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="bg-danger bg-opacity-10 rounded-3 p-2"><i class="bi bi-exclamation-triangle fs-4 text-danger"></i></div>
          <div><div class="fs-4 fw-bold text-danger" x-text="escalatedCount"></div><div class="text-muted small">已提级</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label small fw-medium">关键词搜索</label>
          <input type="search" class="form-control form-control-sm" placeholder="序号/人员/基本情况" x-model="keyword" @keyup.enter="search()" autocomplete="off">
        </div>
        <div class="col-md-2">
          <label class="form-label small fw-medium">辖区</label>
          <select class="form-select form-select-sm" x-model="jurisdiction">
            <option value="">全部</option>
            <template x-for="j in jurisdictions" :key="j.value">
              <option :value="j.value" x-text="j.label"></option>
            </template>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small fw-medium">案件类别</label>
          <select class="form-select form-select-sm" x-model="case_category">
            <option value="">全部</option>
            <template x-for="c in caseCategories" :key="c.value">
              <option :value="c.value" x-text="c.label"></option>
            </template>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small fw-medium">办结状态</label>
          <select class="form-select form-select-sm" x-model="is_closed">
            <option value="">全部</option>
            <option value="1">已办结</option>
            <option value="0">未办结</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label small fw-medium">提级状态</label>
          <select class="form-select form-select-sm" x-model="is_escalated">
            <option value="">全部</option>
            <option value="1">已提级</option>
            <option value="0">未提级</option>
          </select>
        </div>
        <div class="col-md-1 d-flex gap-1">
          <button class="btn btn-primary btn-sm" @click="search()"><i class="bi bi-search"></i></button>
          <button class="btn btn-outline-secondary btn-sm" @click="reset()"><i class="bi bi-arrow-repeat"></i></button>
        </div>
      </div>
      <div class="row g-3 mt-2">
        <div class="col-md-2">
          <label class="form-label small fw-medium">发生时间起</label>
          <input type="date" class="form-control form-control-sm" x-model="date_from">
        </div>
        <div class="col-md-2">
          <label class="form-label small fw-medium">发生时间止</label>
          <input type="date" class="form-control form-control-sm" x-model="date_to">
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th style="min-width:150px" class="sortable" @click="toggleSort('serial_no')">
              序号 <i :class="sortIcon('serial_no')"></i>
            </th>
            <th style="min-width:80px">直守人员</th>
            <th style="min-width:130px" class="sortable" @click="toggleSort('incident_time')">
              发生时间 <i :class="sortIcon('incident_time')"></i>
            </th>
            <th style="min-width:100px">辖区</th>
            <th style="min-width:80px">案件类别</th>
            <th style="min-width:90px">信息来源</th>
            <th style="min-width:180px">基本情况</th>
            <th style="min-width:110px">状态</th>
            <th style="min-width:120px" class="text-end sticky-end">操作</th>
          </tr>
        </thead>
        <tbody>
          <template x-if="loading">
            <tr><td colspan="9" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
          </template>
          <template x-if="!loading && items.length === 0">
            <tr><td colspan="9" class="text-center py-5 text-muted">暂无匹配记录</td></tr>
          </template>
          <template x-for="item in items" :key="item.id">
            <tr>
              <td><a :href="'/ledger/' + item.id + '/view'" class="text-decoration-none fw-medium" x-text="item.serial_no"></a></td>
              <td x-text="item.duty_officer"></td>
              <td x-text="item.incident_time"></td>
              <td x-text="item.jurisdiction"></td>
              <td x-text="item.case_category"></td>
              <td x-text="item.info_source"></td>
              <td><span class="text-truncate d-inline-block" style="max-width:180px" :title="item.case_basic_info_summary" x-text="item.case_basic_info_summary"></span></td>
              <td>
                <span :class="item.is_closed ? 'badge bg-success' : 'badge bg-warning text-dark'" x-text="item.is_closed ? '已办结' : '未办结'"></span>
                <span :class="item.is_escalated ? 'badge bg-danger ms-1' : ''" x-text="item.is_escalated ? '已提级' : ''"></span>
              </td>
              <td class="text-end sticky-end">
                <a :href="'/ledger/' + item.id + '/view'" class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-eye"></i></a>
                <a :href="'/ledger/' + item.id + '/edit'" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a>
                <button class="btn btn-sm btn-outline-danger" @click="confirmDelete(item)"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center" x-show="total_pages > 1">
      <small class="text-muted">共 <span x-text="total"></span> 条</small>
      <nav>
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item" :class="{disabled: page <= 1}"><a class="page-link" href="#" @click.prevent="goPage(page - 1)">&laquo;</a></li>
          <template x-for="p in pageNumbers" :key="p">
            <li class="page-item" :class="{active: p === page}"><a class="page-link" href="#" @click.prevent="goPage(p)" x-text="p"></a></li>
          </template>
          <li class="page-item" :class="{disabled: page >= total_pages}"><a class="page-link" href="#" @click.prevent="goPage(page + 1)">&raquo;</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="modal fade" x-ref="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">确认删除</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">确定要删除序号为 <strong x-text="deleteTargetSerial"></strong> 的台账记录吗？</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-danger" @click="doDelete">确认删除</button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function listPage() {
  return {
    keyword: '', jurisdiction: '', case_category: '', is_closed: '', is_escalated: '',
    date_from: '', date_to: '',
    page: 1, per_page: 20, total: 0, total_pages: 0, items: [],
    sort_by: 'incident_time', sort_order: 'desc',
    loading: false,
    jurisdictions: [], caseCategories: [],
    deleteTargetId: null, deleteTargetSerial: '',
    deleteModal: null,

    init() {
      this.loadEnums();
      this.loadList();
    },

    async loadEnums() {
      try {
        const res = await api.get('/api/enums');
        this.jurisdictions = res.data.jurisdiction || [];
        this.caseCategories = res.data.case_category || [];
      } catch (e) {}
    },

    async loadList() {
      this.loading = true;
      try {
        const params = {
          page: this.page, per_page: this.per_page,
          sort_by: this.sort_by, sort_order: this.sort_order
        };
        if (this.keyword) params.keyword = this.keyword;
        if (this.jurisdiction) params.jurisdiction = this.jurisdiction;
        if (this.case_category) params.case_category = this.case_category;
        if (this.is_closed !== '') params.is_closed = this.is_closed;
        if (this.is_escalated !== '') params.is_escalated = this.is_escalated;
        if (this.date_from) params.date_from = this.date_from;
        if (this.date_to) params.date_to = this.date_to;

        const res = await api.get('/api/ledger', params);
        this.items = res.data.items;
        this.total = res.data.total;
        this.page = res.data.page;
        this.total_pages = res.data.total_pages;
      } catch (e) {
        Toast.show(e.message, 'error');
      } finally {
        this.loading = false;
      }
    },

    get unclosedCount() { return this.items.filter(i => !i.is_closed).length; },
    get closedCount() { return this.items.filter(i => i.is_closed).length; },
    get escalatedCount() { return this.items.filter(i => i.is_escalated).length; },

    get pageNumbers() {
      const pages = [];
      const start = Math.max(1, this.page - 2);
      const end = Math.min(this.total_pages, this.page + 2);
      for (let i = start; i <= end; i++) pages.push(i);
      return pages;
    },

    search() { this.page = 1; this.loadList(); },
    reset() {
      this.keyword = ''; this.jurisdiction = ''; this.case_category = '';
      this.is_closed = ''; this.is_escalated = ''; this.date_from = ''; this.date_to = '';
      this.page = 1; this.loadList();
    },
    goPage(p) { if (p >= 1 && p <= this.total_pages) { this.page = p; this.loadList(); } },

    toggleSort(field) {
      if (this.sort_by === field) {
        this.sort_order = this.sort_order === 'asc' ? 'desc' : 'asc';
      } else {
        this.sort_by = field;
        this.sort_order = 'desc';
      }
      this.page = 1;
      this.loadList();
    },
    sortIcon(field) {
      if (this.sort_by !== field) return 'bi bi-arrow-down-up text-muted';
      return this.sort_order === 'asc' ? 'bi bi-sort-up' : 'bi bi-sort-down';
    },

    confirmDelete(item) {
      this.deleteTargetId = item.id;
      this.deleteTargetSerial = item.serial_no;
      if (!this.deleteModal) this.deleteModal = new bootstrap.Modal(this.$refs.deleteModal);
      this.deleteModal.show();
    },
    async doDelete() {
      try {
        await api.delete('/api/ledger/' + this.deleteTargetId);
        if (this.deleteModal) this.deleteModal.hide();
        Toast.show('台账已删除');
        this.loadList();
      } catch (e) {
        Toast.show(e.message, 'error');
      }
    }
  };
}
</script>
{% endblock %}
