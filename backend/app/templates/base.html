<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="current-user-name" content="{{ current_user.display_name }}">
  <title>{% block title %}警情案件工作台账登记系统{% endblock %}</title>
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div style="position:absolute;opacity:0;height:0;overflow:hidden">
    <input type="text" name="fake_username" tabindex="-1" autocomplete="off">
    <input type="password" name="fake_password" tabindex="-1" autocomplete="off">
  </div>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-0">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-shield-fill fs-5"></i>
        <span class="fw-semibold">警情案件工作台账登记系统</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" href="/"><i class="bi bi-journal-text me-1"></i>台账管理</a>
          </li>
        </ul>
        <span class="navbar-text d-flex align-items-center gap-2">
          <i class="bi bi-person-circle me-1"></i>{{ current_user.display_name }}
          <span class="badge bg-light text-dark ms-1" style="font-size:11px">
            {{ '管理员' if current_user.is_admin() else '用户' }}
          </span>
          <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
            <i class="bi bi-key me-1"></i>修改密码
          </button>
          <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>退出
          </a>
        </span>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4">
    {% block content %}{% endblock %}
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="globalToastContainer"></div>

  <script src="https://cdn.bootcdn.net/ajax/libs/alpinejs/3.14.1/cdn.min.js" defer></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}

  <div class="modal fade" id="changePasswordModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">修改密码</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label small">旧密码</label>
            <input type="password" class="form-control form-control-sm" id="oldPw">
          </div>
          <div class="mb-3">
            <label class="form-label small">新密码（最少 6 位）</label>
            <input type="password" class="form-control form-control-sm" id="newPw">
          </div>
          <div class="mb-0">
            <label class="form-label small">确认新密码</label>
            <input type="password" class="form-control form-control-sm" id="confirmPw">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary btn-sm" id="btnConfirmPw" onclick="changePassword()">确认修改</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
